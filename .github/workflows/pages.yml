name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # el/index.html and el/lab/index.html are committed (the custom domain's real deploy
      # target - a Cloudflare Worker with Git auto-build, see wrangler.jsonc - runs no build
      # step of its own and just serves whatever's in the repo). Rebuilding here too just
      # keeps this GitHub Pages mirror in sync; it's a no-op if scripts/build-el.py was
      # already run and committed before pushing.
      - name: Build the Greek pages (el/) from index.html, lab/index.html + assets/i18n/el.json
        run: python3 scripts/build-el.py
      - name: Assemble site (only the public frontend, not supabase/ or scripts/)
        run: |
          mkdir _site
          cp index.html login.html admin.html dashboard.html pda-login.html 404.html robots.txt sitemap.xml _redirects _site/
          mkdir -p _site/el _site/lab _site/el/lab _site/el/pda
          cp el/index.html _site/el/
          cp lab/index.html _site/lab/
          cp el/lab/index.html _site/el/lab/
          cp el/pda/index.html _site/el/pda/
          mkdir -p _site/pda
          cp pda/index.html pda/changelog.html pda/download.html pda/menu-creator.html pda/help.html pda/terms.html _site/pda/
          cp -r assets _site/assets
          mkdir -p _site/.well-known
          cp .well-known/security.txt _site/.well-known/security.txt
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
