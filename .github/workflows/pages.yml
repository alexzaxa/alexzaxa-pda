name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (only the public frontend, not supabase/ or scripts/)
        run: |
          mkdir _site
          cp index.html changelog.html login.html admin.html dashboard.html download.html menu-creator.html help.html 404.html robots.txt sitemap.xml _site/
          cp -r assets _site/assets
          mkdir -p _site/.well-known
          cp .well-known/security.txt _site/.well-known/security.txt
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
