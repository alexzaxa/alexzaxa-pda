<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Changelog · AlexZaxa Solutions PDA</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="site">
    <div class="brand"><span class="mark">A</span><a href="index.html" style="color:inherit">AlexZaxa Solutions PDA</a></div>
    <nav>
        <a href="help.html">Help</a>
        <a href="changelog.html">Changelog</a>
        <a href="login.html">Log in</a>
    </nav>
</header>
<main>
    <h1>Changelog</h1>
    <p class="lead">Published releases, newest first.</p>
    <table id="releases">
        <thead><tr><th>Version</th><th>Published</th><th>Notes</th></tr></thead>
        <tbody><tr><td colspan="3">Loading…</td></tr></tbody>
    </table>
</main>
<footer class="site">AlexZaxa Solutions PDA</footer>
<script type="module">
import { supabase, formatDate } from "./assets/supabase-client.js";

const tbody = document.querySelector("#releases tbody");
const { data, error } = await supabase
    .from("pda_releases")
    .select("version, published_at, notes")
    .order("published_at", { ascending: false });

if (error) {
    tbody.innerHTML = `<tr><td colspan="3">Could not load releases.</td></tr>`;
} else if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="3">No releases published yet.</td></tr>`;
} else {
    tbody.innerHTML = data.map((r) => `
        <tr>
            <td>${r.version}</td>
            <td>${formatDate(r.published_at)}</td>
            <td>${r.notes ?? "—"}</td>
        </tr>
    `).join("");
}
</script>
</body>
</html>
