<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta property="og:title" content="Changelog · AlexZaxa Solutions PDA">
<meta property="og:description" content="Published releases of AlexZaxa Solutions PDA, newest first.">
<meta property="og:url" content="https://alexzaxa.com/changelog.html">
<meta property="og:locale" content="en_US">
<meta property="og:locale:alternate" content="el_GR">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Changelog · AlexZaxa Solutions PDA">

<meta name="theme-color" content="#1c1c1e">

<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="site">
    <div class="brand"><a href="index.html"><img src="assets/brand/alexzaxa-pda-logo.svg" alt="AlexZaxa Solutions PDA" class="brand-logo"></a></div>
    <nav>
        <a href="help.html" data-i18n="nav_help">Help</a>
        <a href="changelog.html" data-i18n="nav_changelog">Changelog</a>
        <a href="login.html" data-i18n="nav_login">Log in</a>
        <button id="lang-switch" class="lang-switch" type="button">ΕΛ</button>
    </nav>
</header>
<main>
    <h1 data-i18n="title">Changelog</h1>
    <p class="lead" data-i18n="lead">Published releases, newest first.</p>
    <div class="release-list" id="releases">
        <p class="msg" data-i18n="loading">Loading…</p>
    </div>
</main>
<footer class="site">
    <div class="footer-brand">AlexZaxa Solutions PDA</div>
    <div class="footer-contact"><a href="mailto:projects@alexzaxa.com">projects@alexzaxa.com</a><a href="tel:+306981868758">698 186 8758</a></div>
</footer>
<script type="module">
import { supabase, formatDate } from "./assets/supabase-client.js";
import { initLangSwitch, getLang } from "./assets/i18n.js";
import { trackPageView } from "./assets/analytics.js";
import { initPageProgress } from "./assets/motion.js";
initPageProgress();
trackPageView();

const STRINGS = {
    en: {
        nav_help: "Help", nav_changelog: "Changelog", nav_login: "Log in",
        title: "Changelog", lead: "Published releases, newest first.",
        loading: "Loading…", error: "Could not load releases.", empty: "No releases published yet.",
    },
    el: {
        nav_help: "Βοήθεια", nav_changelog: "Ενημερώσεις", nav_login: "Σύνδεση",
        title: "Ενημερώσεις εκδόσεων", lead: "Δημοσιευμένες εκδόσεις, πιο πρόσφατη πρώτα.",
        loading: "Φόρτωση…", error: "Δεν ήταν δυνατή η φόρτωση.", empty: "Δεν έχει δημοσιευτεί ακόμα καμία έκδοση.",
    },
};
initLangSwitch(STRINGS);

const list = document.getElementById("releases");
list.innerHTML = Array.from({ length: 3 }, () => `
    <div class="release-row">
        <div class="release-meta"><span class="skeleton-text" style="max-width:70px"></span><span class="skeleton-text" style="max-width:100px"></span></div>
        <span class="skeleton-text"></span>
    </div>
`).join("");
const { data, error } = await supabase
    .from("pda_releases")
    .select("version, published_at, notes")
    .order("published_at", { ascending: false });

const s = STRINGS[getLang()];
if (error) {
    list.innerHTML = `<p class="msg error">${s.error}</p>`;
} else if (!data.length) {
    list.innerHTML = `<p class="msg">${s.empty}</p>`;
} else {
    list.innerHTML = data.map((r) => `
        <div class="release-row">
            <div class="release-meta">
                <span class="release-version">${r.version}</span>
                <span class="release-date">${formatDate(r.published_at)}</span>
            </div>
            <p class="release-notes">${r.notes ?? "—"}</p>
        </div>
    `).join("");
}
</script>
</body>
</html>
