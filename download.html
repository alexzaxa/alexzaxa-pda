<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download · AlexZaxa Solutions PDA</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1c1c1e">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="site">
    <div class="brand"><span class="mark">A</span><a href="index.html" style="color:inherit">AlexZaxa Solutions PDA</a></div>
    <nav>
        <a href="menu-creator.html">Menu Creator</a>
        <a href="#" id="logout">Log out</a>
    </nav>
</header>
<main class="narrow">
    <h1>Download PDA</h1>
    <p class="lead" style="font-size:0.92rem" id="intro">Latest release, ready to install.</p>
    <div id="release-card"></div>
    <p class="lead" style="font-size:0.88rem;margin-top:2rem">
        Building your menu before install? Use the <a href="menu-creator.html">Menu Creator</a>
        to prepare a CSV you can import straight into the PDA.
    </p>
</main>
<script type="module">
import { supabase, requireRole, formatDate, SUPABASE_URL } from "./assets/supabase-client.js";
import { initPageProgress } from "./assets/motion.js";
initPageProgress();

const auth = await requireRole(["admin", "download"]);
if (!auth) throw new Error("redirecting");

document.getElementById("logout").addEventListener("click", async (e) => {
    e.preventDefault();
    await supabase.auth.signOut();
    window.location.href = "login.html";
});

document.getElementById("release-card").innerHTML =
    `<div class="skeleton-block" style="height:6.5rem;margin-top:1.5rem"></div>`;

const { data: release, error } = await supabase
    .from("pda_releases")
    .select("version, sha256, storage_path, published_at, notes")
    .order("published_at", { ascending: false })
    .limit(1)
    .maybeSingle();

const card = document.getElementById("release-card");
if (error || !release) {
    card.innerHTML = `<p class="msg error">No release has been published yet. Check back soon.</p>`;
} else {
    const url = `${SUPABASE_URL}/storage/v1/object/public/pda-releases/${release.storage_path}`;
    card.innerHTML = `
        <div class="card" style="margin-top:1.5rem">
            <h3>Version ${release.version}</h3>
            <p>Published ${formatDate(release.published_at)}</p>
            ${release.notes ? `<p>${release.notes}</p>` : ""}
        </div>
        <a class="btn" style="display:inline-block;margin-top:1rem;text-decoration:none" href="${url}" download>Download alexzaxa-pda-${release.version}.zip</a>
        <p class="msg" style="color:var(--text-dim);margin-top:1rem">SHA-256: <span class="reveal" style="display:inline;padding:0.2rem 0.4rem">${release.sha256}</span></p>
    `;
}
</script>
</body>
</html>
