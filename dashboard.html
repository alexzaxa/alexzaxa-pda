<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · AlexZaxa Solutions PDA</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1c1c1e">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="site">
    <div class="brand"><a href="index.html"><img src="assets/brand/alexzaxa-pda-logo.svg" alt="AlexZaxa Solutions PDA" class="brand-logo"></a></div>
    <nav><a href="#" id="logout">Log out</a></nav>
</header>
<main>
    <div class="section-header">
        <h1>Income</h1>
        <div>
            <button class="btn secondary" id="live-update" type="button">Live update</button>
            <span class="msg" id="live-update-msg" style="display:inline-block;margin-left:0.5rem"></span>
        </div>
    </div>
    <p class="lead" id="scope-note">Showing the stores you've been given access to.</p>
    <div class="callout" id="demo-banner" style="display:none">
        <p class="lead" style="margin:0">
            You're viewing a live demo with sample data. <a href="index.html#get-started">Get started with your own restaurant →</a>
        </p>
    </div>

    <div class="stat-tiles">
        <div class="stat-tile">
            <span class="stat-label">Today so far</span>
            <strong class="stat-value" id="stat-today">–</strong>
        </div>
    </div>

    <div id="income-chart" style="margin-bottom:1.75rem"></div>

    <div id="comparison-section"></div>

    <h2>Daily totals</h2>
    <div class="section-header">
        <p class="lead">Raw order detail is kept 15 days; daily totals are kept forever.</p>
        <button class="btn secondary" id="export-excel" type="button">Export to Excel</button>
    </div>
    <table id="daily-table">
        <thead><tr><th>Store</th><th>Day</th><th>Orders</th><th>Total</th></tr></thead>
        <tbody><tr><td colspan="4">Loading…</td></tr></tbody>
    </table>
</main>
<script type="module">
import { supabase, requireRole, formatCents } from "./assets/supabase-client.js";
import { renderBarChart } from "./assets/chart.js";
import { skeletonRows, setButtonLoading, initPageProgress } from "./assets/motion.js";
initPageProgress();
import * as XLSX from "https://esm.sh/xlsx@0.18.5";

const auth = await requireRole("restricted");
if (!auth) throw new Error("redirecting");

document.querySelector("#daily-table tbody").innerHTML = skeletonRows(4);

if (auth.session.user.email === "demo@alexzaxa-pda.internal") {
    document.getElementById("demo-banner").style.display = "block";
}

document.getElementById("logout").addEventListener("click", async (e) => {
    e.preventDefault();
    await supabase.auth.signOut();
    window.location.href = "login.html";
});

// RLS scopes both to only the stores this account has been granted.
let stores = [];
const nameFor = (id) => stores?.find((s) => s.id === id)?.name ?? id;

async function loadIncome() {
    const { data: storeRows } = await supabase.from("stores_public").select("id, name");
    stores = storeRows || [];

    if (!stores.length) {
        document.getElementById("scope-note").textContent =
            "You don't have access to any store yet. Ask the admin to grant you access.";
    }

    const today = new Date().toISOString().slice(0, 10);
    const { data: todayRows } = await supabase.from("store_daily_totals").select("total_cents").eq("day", today);
    document.getElementById("stat-today").textContent = formatCents((todayRows || []).reduce((sum, r) => sum + r.total_cents, 0));

    const { data: daily, error } = await supabase
        .from("store_daily_totals")
        .select("store_id, day, orders, total_cents")
        .order("day", { ascending: false })
        .limit(200);

    const dailyBody = document.querySelector("#daily-table tbody");
    const chartContainer = document.getElementById("income-chart");
    const comparisonSection = document.getElementById("comparison-section");

    if (error || !daily) {
        dailyBody.innerHTML = `<tr><td colspan="4">Could not load income.</td></tr>`;
        chartContainer.innerHTML = "";
        comparisonSection.innerHTML = "";
        return;
    }

    const byDay = new Map();
    for (const row of daily) byDay.set(row.day, (byDay.get(row.day) || 0) + row.total_cents);
    renderBarChart(chartContainer, [...byDay.entries()].map(([day, total_cents]) => ({ day, total_cents })).sort((a, b) => a.day.localeCompare(b.day)),
        { day: (r) => r.day, value: (r) => r.total_cents, formatValue: formatCents });

    const byStore = new Map();
    for (const row of daily) {
        const entry = byStore.get(row.store_id) || { days: 0, total: 0 };
        entry.days += 1;
        entry.total += row.total_cents;
        byStore.set(row.store_id, entry);
    }
    const storeTotals = [...byStore.entries()].sort((a, b) => b[1].total - a[1].total);
    const tile = (id, e) => `
        <div class="stat-tile">
            <span class="stat-label">${nameFor(id)}</span>
            <strong class="stat-value">${formatCents(e.total)}</strong>
            <div class="muted-note" style="display:block;margin-top:0.4rem">${e.days} day${e.days === 1 ? "" : "s"} synced</div>
        </div>
    `;
    if (storeTotals.length > 1) {
        const days = daily.map((r) => r.day).sort();
        comparisonSection.innerHTML = `
            <h2>Compare stores</h2>
            <p class="lead" style="margin-top:-0.5rem">Totals from ${days[0]} to ${days[days.length - 1]}.</p>
            <div class="stat-tiles">${storeTotals.map(([id, e]) => tile(id, e)).join("")}</div>
        `;
    } else if (storeTotals.length === 1) {
        const [id, e] = storeTotals[0];
        comparisonSection.innerHTML = `<div class="stat-tiles">${tile(id, e)}</div>`;
    } else {
        comparisonSection.innerHTML = "";
    }

    dailyBody.innerHTML = daily.length
        ? daily.map((r) => `<tr><td>${nameFor(r.store_id)}</td><td>${r.day}</td><td>${r.orders}</td><td>${formatCents(r.total_cents)}</td></tr>`).join("")
        : `<tr><td colspan="4">No income yet.</td></tr>`;
}

document.getElementById("live-update").addEventListener("click", async () => {
    const button = document.getElementById("live-update");
    const msg = document.getElementById("live-update-msg");
    setButtonLoading(button, true, "Updating…");
    await loadIncome();
    setButtonLoading(button, false);
    msg.textContent = `Updated ${new Date().toLocaleTimeString()}`;
});

await loadIncome();

document.getElementById("export-excel").addEventListener("click", async () => {
    const button = document.getElementById("export-excel");
    setButtonLoading(button, true, "Exporting…");
    try {
        const { data, error: exportError } = await supabase
            .from("store_daily_totals")
            .select("store_id, day, orders, total_cents")
            .order("day", { ascending: true });
        if (exportError || !data.length) {
            alert(exportError ? exportError.message : "No income to export yet.");
            return;
        }
        const rows = data.map((r) => ({
            Store: nameFor(r.store_id),
            Day: r.day,
            Orders: r.orders,
            "Total (EUR)": r.total_cents / 100,
        }));
        const sheet = XLSX.utils.json_to_sheet(rows);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, sheet, "Daily income");
        XLSX.writeFile(workbook, `alexzaxa-pda-income-${new Date().toISOString().slice(0, 10)}.xlsx`);
    } finally {
        setButtonLoading(button, false);
    }
});
</script>
</body>
</html>
